name: Build and push Docker image

on:
  push:
    branches: ["INT_*", "PROD_*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref_name, 'PROD_') && 'INTEGRATION' || 'TEST' }}
    steps:
      - name: Rewrite Phabricator submodule URLs to GitHub
        run: |
          git config --global url."https://github.com/wmde/DataValuesJavaScript.git".insteadOf "https://phabricator.wikimedia.org/source/datavalues-javascript.git"
          git config --global url."https://github.com/wmde/WikibaseSerializationJavaScript.git".insteadOf "https://phabricator.wikimedia.org/source/wikibase-serialization.git"
          git config --global url."https://github.com/wmde/WikibaseDataModelJavaScript.git".insteadOf "https://phabricator.wikimedia.org/source/wikibase-data-model.git"

      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Checkout submodules with retry
        shell: bash
        run: |
          max_attempts=5
          delay=15

          for attempt in $(seq 1 "$max_attempts"); do
            echo "Submodule checkout attempt ${attempt}/${max_attempts}"
            if git -c http.maxRequests=1 submodule update --init --recursive --jobs 1; then
              exit 0
            fi

            if [[ "$attempt" -eq "$max_attempts" ]]; then
              echo "::error::Submodule checkout failed after ${max_attempts} attempts"
              exit 1
            fi

            echo "Submodule checkout failed; retrying in ${delay}s"
            sleep "$delay"
            delay=$((delay * 2))
          done

      - uses: docker/setup-buildx-action@v4

      - name: Login to custom registry (INT)
        if: startsWith(github.ref_name, 'INT_')
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CUSTOM_REGISTRY_URL }}
          username: ${{ secrets.CUSTOM_REGISTRY_USER }}
          password: ${{ secrets.CUSTOM_REGISTRY_PASSWORD }}

      - name: Login to Docker Hub (PROD)
        if: startsWith(github.ref_name, 'PROD_')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Select target image
        id: target
        env:
          CUSTOM_REPO: ${{ secrets.CUSTOM_REGISTRY_REPO }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [[ "$GITHUB_REF_NAME" == PROD_* ]]; then
            echo "image=${DH_USER}/wikiromandie" >> "$GITHUB_OUTPUT"
          else
            echo "image=${CUSTOM_REPO}" >> "$GITHUB_OUTPUT"
          fi

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.target.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - name: Install Railpack
        run: |
          curl -sSL https://railpack.com/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate Railpack build plan
        run: railpack prepare . --plan-out ./railpack-plan.json --info-out ./railpack-info.json

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./railpack-plan.json
          platforms: linux/amd64
          build-args: |
            BUILDKIT_SYNTAX=ghcr.io/railwayapp/railpack-frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dokploy Deployment into INT
        if: startsWith(github.ref_name, 'PROD_')
        uses: benbristow/dokploy-deploy-action@0.2.2
        with:
          api_token: ${{ secrets.DOKPLOY_AUTH_TOKEN }}
          application_id: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          dokploy_url: ${{ secrets.DOKPLOY_URL }}
          service_type: application

      - name: Dokploy Deployment into TEST
        if: startsWith(github.ref_name, 'INT_')
        uses: benbristow/dokploy-deploy-action@0.2.2
        with:
          api_token: ${{ secrets.DOKPLOY_AUTH_TOKEN }}
          application_id: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          dokploy_url: ${{ secrets.DOKPLOY_URL }}
          service_type: application